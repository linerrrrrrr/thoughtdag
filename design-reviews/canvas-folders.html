  const action = (name, id) => `data-do="${esc(name)}" data-id="${esc(id)}"`;
  const folderRow = (folder, unfiled = false) => {

  const canvasRow = (canvas) => {

    return `<div class="fd-cols-row"${current ? ' aria-current="page"' : ''}>

  </button>${move(canvas)}</div>`;

  </button>${move(canvas)}</div>`;
  const cover = folder => {
    const canvases = membersOf(folder.id);
    const folderId = escape(folder.id);
    const samples = canvases.slice(0, 3).map(canvas => `<span class="fd-shelf-sample">${thumb(canvas)}<span class="fd-shelf-caption">${escape(canvas.name)}</span></span>`).join('');

  };

  }
  const orphans = membersOf('');
  return `<section class="fd-shelf-page"><header class="fd-shelf-head"><h2>画布库</h2>${returnButton}</header>

      const active = canvas.id===state.current;
      const name = escape(canvas.name), id=escape(canvas.id);
      return `<div class="fd-tree-line ${active?'is-current':''}"><button type="button" class="fd-canvas-item" data-do="canvas" data-id="${id}" ${active?'aria-current="page"':''}>${icon('workflow')}<span class="fd-name">${name}</span>${active?icon('check','fd-active-check'):''}</button><button type="button" class="fd-move" aria-label="移动画布「${name}」" data-tooltip="移到文件夹" data-do="move" data-id="${id}">${icon('folder-input')}</button></div>`;
    }
    const groups=state.folders.map(folder=>{
      const members=state.canvases.filter(c=>c.folder===folder.id);
      const expanded = state.expanded.has(folder.id), id=escape(folder.id);
      return `<div class="fd-group-head"><button type="button" class="fd-group-toggle" aria-expanded="${expanded}" data-do="expand" data-id="${id}">${icon(expanded?'chevron-down':'chevron-right','fd-caret')}${icon(expanded?'folder-open':'folder')}<span class="fd-name">${escape(folder.name)}</span><span class="fd-folder-count">${members.length}</span></button><button type="button" class="fd-quiet fd-group-export" aria-label="导出文件夹「${escape(folder.name)}」" data-do="export" data-id="${id}">${icon('download')}导出文件夹</button></div>${expanded?`<div class="fd-children">${members.map(row).join('')||'<span class="fd-muted" style="padding-left:8px;font-size:12px">空文件夹</span>'}</div>`:''}`;
    }).join('');
    const free=state.canvases.filter(c=>!c.folder);
    return `<section class="fd-tree" aria-label="画布目录"><header class="fd-tree-head"><h2>画布目录</h2><button type="button" class="fd-new-folder" data-do="new-folder">${icon('folder-plus')}新建文件夹</button></header><div class="fd-tree-body">${groups}${free.length?`<div class="fd-root-canvas"><div class="fd-root-label">未归类</div>${free.map(row).join('')}</div>`:''}</div><footer class="fd-tree-foot"><button type="button" class="fd-quiet fd-style" data-do="new-canvas" data-id="">${icon('plus')}新建画布</button><span class="fd-muted" style="padding:0 8px;font-size:12px">共 ${state.canvases.length} 张画布</span></footer></section>`;
  }
  function dialog(state) {
    if (!state.dialog) return '';
    const {type,id} = state.dialog;
    const folder=state.folders.find(f=>f.id===id), canvas=state.canvases.find(c=>c.id===id);
    let title='', body='';
    if (type==='export') {
      const files=state.canvases.filter(c=>c.folder===id);
      title='整夹导出预览';
      body=`<div class="fd-package">${icon('file-archive')}<span>${escape(folder.name)}.zip</span></div><p class="fd-muted" style="font-size:13px;margin-bottom:12px">包含此文件夹中的 ${files.length} 张画布</p><ul class="fd-files">${files.map(c=>`<li>${icon('file-json')}<span>${escape(c.name)}.thoughtdag.json</span></li>`).join('')}</ul><div class="fd-dialog-foot"><button type="button" class="fd-btn" data-do="dismiss">返回目录</button></div>`;
    } else if (type==='move') {
      title='移到文件夹';
      const all=[...state.folders,{id:'',name:'未归类'}];
      body=`<p class="fd-muted" style="margin-top:6px">画布「${escape(canvas.name)}」</p><div class="fd-move-list">${all.map(f=>`<button type="button" class="fd-quiet" data-do="move-to" data-id="${escape(f.id)}">${icon(f.id?'folder':'inbox')}${escape(f.name)}${f.id===canvas.folder?icon('check'):''}</button>`).join('')}</div>`;
    } else {
      const isFolder=type==='new-folder';
      title=isFolder?'新建文件夹':'新建画布';
      body=`<div><label>${isFolder?'文件夹名称':'画布名称'}<input name="name" required maxlength="64" autocomplete="off" placeholder="${isFolder?'输入文件夹名称':'输入画布名称'}"></label>${isFolder?'':`<p class="fd-muted" style="margin-top:6px;font-size:12px">保存到${folder?`「${escape(folder.name)}」`:'未归类'}</p>`}<div class="fd-dialog-foot"><button class="fd-quiet" type="button" data-do="dismiss">取消</button><button class="fd-primary" type="button" data-do="create">创建</button></div></div>`;
    }
    return `<div class="fd-scrim"><section class="fd-dialog" role="dialog" aria-modal="true" aria-label="${title}"><header class="fd-dialog-head"><h2>${title}</h2><button class="fd-quiet" type="button" data-do="dismiss" aria-label="关闭">${icon('x')}</button></header>${body}</section></div>`;
  }
  for (const stage of root.querySelectorAll('.fd-stage')) {
    const mode=stage.dataset.mode;
    const state={
      folders:[{id:'research',name:'用户研究'},{id:'planning',name:'产品规划'}],
      canvases:seeds.map(([id,folder,name,nodes,time])=>({id,folder,name,nodes,time})),
      current:'interviews',folder:'research',shelfFolder:null, expanded:new Set(['research']),open:true,dialog:null
    };
    let opener=null, nameCounter=0;
    function render() {
      const current=state.canvases.find(c=>c.id===state.current);
      const scene=current.id==='interviews'?originalScene.innerHTML:`<div class="fd-scene-alt">${current.nodes?miniature(current.id):''}<b>${escape(current.name)}</b>${current.nodes?'':'<span class="fd-muted">空白画布</span>'}</div>`;
      const zoom=`<div class="fd-zoom" aria-hidden="true">${icon('minus')}75%${icon('plus')}${icon('scan')}</div>`;
      const surface=mode==='shelf'&&state.open ? window.fdRenderShelf(state,ui) : `<div class="fd-backdrop">${scene}</div>${toolbar(state)}${zoom}${state.open?(mode==='tree'?tree(state):window.fdRenderColumns(state,ui)):''}`;
      stage.innerHTML=surface + dialog(state);
      stage.querySelectorAll('button').forEach(button=>button.classList.add('cursor-interaction'));
      globalThis.lucide?.createIcons({attrs:{width:16,height:16}});
    }
    function restore() {
      if (opener) Array.from(stage.querySelectorAll('button')).find(b=>b.dataset.do===opener.action && (b.dataset.id||'')===opener.id)?.focus();
    }
    function dismiss() { state.dialog=null; render(); restore(); }
    stage.addEventListener('click', event=>{
      if (event.target.classList.contains('fd-scrim')) { dismiss(); return; }
      const button=event.target.closest('button[data-do]');
      if(!button) {
        if(mode==='tree' && state.open && !state.dialog && !event.target.closest('.fd-tree,.fd-bar')) { state.open=false; render(); }
        return;
      }
      const action=button.dataset.do, id=button.dataset.id || '';
      if(action==='dismiss') { dismiss(); return; }
      if(action==='create') { createItem(); return; }
      if(action==='toggle') state.open=!state.open;
      if(action==='close') state.open=false;
      if(action==='folder') state.folder=id;
      if(action==='expand') { if(state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id); }
      if(action==='shelf-folder') state.shelfFolder=id || null;
      if(action==='canvas') { state.current=id; state.open=mode==='columns'; }
      if(['new-folder','new-canvas','export','move'].includes(action)) {
        opener={action,id};
        state.dialog={type:action,id};
      }
      if(action==='move-to' && state.dialog?.type==='move') {
        state.canvases.find(c=>c.id===state.dialog.id).folder=id;
        if(id) state.expanded.add(id);
        state.dialog=null;
      }
      render();
      if(state.dialog) (stage.querySelector('.fd-dialog input')||stage.querySelector('.fd-dialog button'))?.focus();
      else if(!state.open) stage.querySelector('[data-do="toggle"]')?.focus();
      else Array.from(stage.querySelectorAll('[data-do]')).find(b=>b.dataset.do===action&&(b.dataset.id||'')===id)?.focus();
    });
    function createItem() {
      const input=stage.querySelector('.fd-dialog input'), name=input.value.trim();
      if(!name){input.focus();return;}
      const id=`draft-${++nameCounter}`;
      if(state.dialog.type==='new-folder') {
        state.folders.push({id,name});
        state.expanded.add(id);
        state.folder=id;
      } else {
        const folder=state.dialog.id;
        state.canvases.push({id,name,folder,nodes:0,time:'刚刚'});
        if(folder)state.expanded.add(folder);
      }
      dismiss();
    }
    stage.addEventListener('keydown',event=>{
      if(event.isComposing || event.keyCode===229) return;
      if(event.key==='Enter' && event.target.matches('.fd-dialog input')) { event.preventDefault(); createItem(); return; }
      if(state.dialog && event.key==='Tab') {
        const controls=[...stage.querySelectorAll('.fd-dialog input,.fd-dialog button')], first=controls[0], last=controls.at(-1);
        if(event.shiftKey && document.activeElement===first){event.preventDefault();last.focus();}
        else if(!event.shiftKey && document.activeElement===last){event.preventDefault();first.focus();}
      }
      if(event.key!=='Escape')return;
      if(state.dialog) dismiss();
      else if(state.open){state.open=false;render();stage.querySelector('[data-do="toggle"]')?.focus();}
      event.stopPropagation();
    });
    render();
  }
})();
</script>
